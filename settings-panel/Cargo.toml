[workspace]
resolver = "2"
default-members = ["mundane-settings", "mundane-settings-core"]
members = [
    "mundane-settings",
    "mundane-settings-core",
    "mundane-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["mundaneDE contributors"]

[workspace.dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "io-util"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
clap = { version = "4", features = ["derive"] }
toml_edit = "0.22"

# Keep both Zed dependencies in sync with mundane-apps and gpui-shades.
gpui = { git = "https://github.com/zed-industries/zed", rev = "f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f4fe0be1f8c7974db07e01c5cd05bee0cf4eb8d9", features = ["font-kit", "wayland", "x11"] }

mundane-ui = { git = "https://github.com/theJoeLinuxFoundation/mundane-apps", rev = "80eed70f87a44cd31743cef499b8d42df8f097d3" }

mundane-settings-core = { path = "mundane-settings-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
