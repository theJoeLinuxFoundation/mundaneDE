[package]
name = "mundane-lock"
version.workspace = true
edition.workspace = true
license = "BSD-3-Clause"
description = "PAM locker for the mundaneDE GPUI session"

[dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["wayland"] }
mundane-ui.workspace = true
serde.workspace = true
serde_json = "1"
async-channel = "2"
accesskit = "0.24"
pam-client = { version = "0.5", default-features = false }
nix = { version = "0.29", features = ["user"] }
libc = "0.2"
zeroize = "1"
glib = "0.22"
